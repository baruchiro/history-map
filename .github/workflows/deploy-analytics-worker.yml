name: Deploy analytics Worker
on:
  push:
    branches: [master]
    paths:
      - 'workers/analytics/**'
      - 'docs/site/catalog.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-analytics-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the allowlist from the catalog
        run: python3 scripts/sync_allowed_lists.py
      - name: Install and test
        working-directory: workers/analytics
        run: |
          npm install --no-audit --no-fund
          node --test test/*.mjs
      - name: Apply D1 migrations and deploy
        working-directory: workers/analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Cloudflare secrets not set; skipping deploy"; exit 0; fi
          npx wrangler d1 migrations apply history-map-analytics --remote
          npx wrangler deploy
